name: Release

on:
  workflow_dispatch:
  # 只按 tag 构建：同一次提交如果既推 main 又推 tag，会各触发一次构建，
  # 其中 main 那次不会发布（Release 步骤只认 tag），纯属浪费 runner 时间
  push:
    tags:
      - v*

jobs:
  check-version:
    name: Check if version changed
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PREVIOUS_VERSION=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version")
          echo "Current: v${CURRENT_VERSION}, Previous: v${PREVIOUS_VERSION}"
          echo "version=v${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed!"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged, skipping build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: build and release electron app
    needs: check-version
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      needs.check-version.outputs.version_changed == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App (skip publish)
        run: npm run dist -- --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: release

      # softprops/action-gh-release@v1 在本仓库不会实际上传附件（release 里只有源码），
      # 这里直接用 gh 上传，并把 Release 标题统一成 "Hydrogen Music vX.Y.Z"
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="Hydrogen Music ${TAG}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" --notes "" || true
          fi
          gh release edit "$TAG" --title "$TITLE" || true
          # 注意：Windows runner 上 PATH 里的 find.exe 是「文本查找」工具，
          # 不是 git-bash 的 find，用它筛文件会得到空结果（步骤还是绿的但什么都没上传），
          # 这里改用 bash 的 globstar 遍历产物目录
          shopt -s nullglob globstar
          count=0
          # 不再假设产物目录层级：递归找安装包与元数据，但排除解包目录里的内部文件
          # （win-unpacked / *.app 里有大量 Chromium 文件，不能上传）
          # 用 node 复用 build.js 的产物定位逻辑（release/<version> 或最近修改的子目录），
          # 比 bash 的层级 glob 更可靠：macOS 的 .dmg/.zip 位置与 Windows 不同
          mapfile -t FILES < <(node -e '
            const fs = require("fs"), path = require("path");
            const v = require("./package.json").version;
            const base = path.join(process.cwd(), "release");
            if (!fs.existsSync(base)) { console.error("no release dir"); process.exit(0); }
            let dir = path.join(base, v);
            if (!fs.existsSync(dir)) {
              const ds = fs.readdirSync(base)
                .map(n => ({ n, t: fs.statSync(path.join(base, n)).mtimeMs }))
                .sort((a, b) => b.t - a.t);
              if (ds.length) dir = path.join(base, ds[0].n);
            }
            for (const f of fs.readdirSync(dir)) {
              if (/\.(exe|zip|dmg|yml|blockmap)$/.test(f)) console.log(path.join(dir, f));
            }
          ')
          echo "candidates: ${#FILES[@]}"
          for f in "${FILES[@]:-}"; do
            [ -f "$f" ] || continue
            echo "uploading $f"
            uploaded=0
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then
                uploaded=1
                break
              fi
              echo "upload failed (attempt $attempt), retrying in 15s"
              sleep 15
            done
            if [ "$uploaded" -eq 1 ]; then
              count=$((count + 1))
            else
              echo "::warning::upload failed after retries: $f"
            fi
          done
          echo "uploaded $count file(s)"
          echo "--- release tree (maxdepth 4) ---"
          find release -maxdepth 4 -type f | head -60 || true
          if [ "$count" -eq 0 ]; then
            # 本 job 没找到产物时，若 Release 上已有附件（另一平台的 job 传过），
            # 视为该平台无可上传文件，给出警告而不是让整次 Release 红灯
            existing=$(gh release view "$TAG" --json assets -q '.assets | length' 2>/dev/null || echo 0)
            if [ "${existing:-0}" -gt 0 ]; then
              echo "::warning::本 job 未找到可上传产物，Release 已存在 $existing 个附件，跳过"
            else
              echo "::error::release 目录里没有找到任何产物"
              exit 1
            fi
          fi
